distill:
  chunk_size: 5000
  max_profile_len: 8000
  map_concurrency: 60  # Map 阶段并发数。免费档/低限额 API key 建议降到 3-5
llm:
  # api_key 请在 .env 中设置 DEEPSEEK_API_KEY，或在 Web 设置页填写
  base_url: https://api.deepseek.com
  # 4096 的来历只有 commit 标题（c2086347 首值 → 8955a683→16384 → 70bd104f→1024 →
  # 24855554 回到 4096），无量化依据；相对模型 384K 输出上限是万分之一，暂维持不动。
  # 复现路径与实测数据见 AGENTS.md「蒸馏管线」二、三节。调新值前先按第四节拿数据。
  # 环境变量 LLM_MAX_TOKENS 可临时覆盖本值（压过本文件，不发版）。
  max_tokens: 4096
  # V4.1-Flash（2026-09-10 发布）。官方称其在效果/成本/速度上全面超过 V4-Pro，并同步
  # 下调了 Flash 的价格；对 V4-Pro 的原话是「在 2026 年 9 月 14 日之后继续提供
  # DeepSeek V4 Pro 的 API 调用服务，计费方式保持不变」—— 即没有停用、也没有改价。
  # 这里仍选 Flash 是本项目的取舍（成本/速度），不是 V4-Pro 下线所致。
  # https://api-docs.deepseek.com/zh-cn/updates/
  model: deepseek-flash
  presence_penalty: 0.3  # 防重复，温和不磨平口头禅
  summary_threshold: 100
  temperature: 0.7
rag:
  chunk_overlap: 50
  chunk_size: 500
  top_k: 3
  # embedding_model 已废弃（改为固定使用阿里云百炼 text-embedding-v4），
  # 用户在设置页填写 DASHSCOPE_API_KEY 即可。
  # key 和 region 为每个用户独立配置，不由全局配置决定。
# 存储后端由 .env 的 STORAGE_BACKEND 决定：
#   STORAGE_BACKEND=postgres -> 用 DATABASE_URL（生产推荐），忽略下方 path
#   STORAGE_BACKEND=sqlite   -> 用下方 path（本地开发 / 回退）
storage:
  path: data/character_sim.db
  type: sqlite
voice:
  cache_dir: data/voice_cache
  default_speed: 1.0
  enabled: false
  funasr_url: ws://127.0.0.1:10095
  gptsovits_url: http://127.0.0.1:9880
  ref_audio_max_seconds: 60
  ref_audio_min_seconds: 30
wechat:
  agent_id: ''
  corp_id: ''
  default_text_id: ''
  enabled: false
  encoding_aes_key: ''
  secret: ''
  token: ''
memory:
  enabled: true
  provider: "local"
  search_top_k: 10
  context_window: 30
