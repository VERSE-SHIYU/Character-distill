# ============================================================
# 本地开发测试编排 — 现场构建，不拉 GHCR 镜像
#
# 与 prod 编排的关键区别：
#   1. app 用 build: . 而非 image: ghcr.io/...（跑本地最新代码）
#   2. 去掉 nginx / fail2ban，直连 app:7860
#   3. 端口不绑 127.0.0.1，方便 Windows 浏览器直接访问
#
# 启动：docker compose -f docker-compose.local.yml up -d --build
# 重建（仅 app）：docker compose -f docker-compose.local.yml up -d --build app
# 注意：这份文件不要提交 git！
# ============================================================

services:
  postgres:
    image: postgres:16-alpine
    environment:
      # :? = 缺变量即在解析期失败并点名（不是 `:-` 给默认值）。插值是文件级的，
      # 此处加守卫即覆盖下面 app 的 DATABASE_URL 与本 service 的 healthcheck —— 不逐处重复。
      POSTGRES_USER: "${POSTGRES_USER:?缺 POSTGRES_USER：填进 .env（模板见 .env.example）}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?缺 POSTGRES_PASSWORD：填进 .env（模板见 .env.example）}"
      POSTGRES_DB: "${POSTGRES_DB:?缺 POSTGRES_DB：填进 .env（模板见 .env.example）}"
      LANG: C.UTF-8
    command: >
      postgres
      -c shared_buffers=128MB
      -c max_connections=50
      -c effective_cache_size=256MB
      -c work_mem=4MB
      -c maintenance_work_mem=32MB
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      # 就绪探针必须**真的拿凭据登录一次**，不能用 pg_isready：
      #   1. `pg_isready` 不验证凭据 —— 官方语义是「不需要正确的用户名 / 口令 / 库名即可取得
      #      服务器状态」。实测两变量为空时它照样输出 `accepting connections` 且 exit=0，
      #      即这道门一个半月里没验过一次凭据，也不可能因凭据问题变红（缺陷 41）。
      #   2. 官方镜像里 **unix socket 与 127.0.0.1 都是 trust 认证**，只有非环回地址才走
      #      scram 校验口令（实测）。故要走 TCP，且不能拿环回地址当 `-h`。
      #   3. 于是 `-h` 用**服务名** postgres：与 app 连库走同一条路径、同一套 pg_hba 规则；
      #      写 localhost / 127.0.0.1 会让探针退化成 trust，又能「永远成功」。
      #   4. 为什么是多份定义而不是共享一份：部署只 scp docker-compose.prod.yml 这一个文件
      #      到服务器，抽成共享脚本或共享 compose 文件会改动两区部署流程、并新增挂载依赖。
      #      多份的一致性由 tests/test_pg_gate.py 强制保证。
      # `$$` 是 compose 的转义：容器配置里存下的是**变量名**，展开发生在容器内的 shell
      # （`docker inspect` 看到的是 `$POSTGRES_PASSWORD` 这个变量名，不是口令值）。
      # PGCONNECT_TIMEOUT(3s) 必须小于本 healthcheck 的 timeout(5s)，否则探针自己会挂到超时，
      # 「连不上」与「连得慢」又共用一个信号。stderr 不重定向 —— 认证失败的原文进健康日志。
      test: ["CMD-SHELL", "PGPASSWORD=\"$$POSTGRES_PASSWORD\" PGCONNECT_TIMEOUT=3 psql -h postgres -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\" -tAc 'select 1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
    oom_score_adj: -500
    mem_limit: 512m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - prod

  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: jaeger-otel
    ports:
      - "16686:16686"            # UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC
      - "127.0.0.1:4318:4318"    # OTLP HTTP（容器内 app 走服务名 jaeger:4318）
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    mem_limit: 512m
    mem_reservation: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - prod

  app:
    build: .
    ports:
      - "7861:7860"
    volumes:
      - ./data:/app/data
    # 容器→Windows host 的 mock LLM/embed/mem0 走 host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # ②④ Step 3/4：OTel 开关 + OTLP 导出（默认关；压测时 shell 置 OTEL_ENABLED=1 OTEL_EXPORTER=otlp 再 up -d app）
      - OTEL_ENABLED=${OTEL_ENABLED:-0}
      - OTEL_EXPORTER=${OTEL_EXPORTER:-}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # ②④ Step 1：本地压测把两条外部通道指向 host mock（未设置用内置 region/DeepSeek 默认）
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-}
      - MEM0_LLM_BASE_URL=${MEM0_LLM_BASE_URL:-}
    depends_on:
      postgres:
        condition: service_healthy
    oom_score_adj: 300
    mem_limit: 768m
    mem_reservation: 384m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - prod

networks:
  prod:

volumes:
  pg_data:
