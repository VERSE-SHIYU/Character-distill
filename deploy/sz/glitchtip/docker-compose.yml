# ============================================================
# GlitchTip 报错收集（SZ 专属，独立于主站 compose）
#
# 为什么不并进主 compose / 发版流水线：
#   - 镜像 tag 是上游的 `6`，与主站 commit sha 无对应关系；混进 deploy.yml 会让
#     「当前运行版 = commit_sha」这条规则失效（rollback 也会指向错的镜像）。
#   - 2G 机器上它是可摘除件：隔离验证要求「停掉 glitchtip，主站照常」。
#   落点与更新方式见同目录 README.md。
#
# 启动：cd /opt/glitchtip && docker compose -p glitchtip up -d
# ============================================================
name: glitchtip

services:
  glitchtip:
    image: glitchtip/glitchtip:6
    environment:
      # all_in_one = web + worker + migrate 同进程。官方文档里以
      # `SERVER_ROLE=all_in_one` 的形式给出（等价于旧写法 GLITCHTIP_EMBED_WORKER）。
      - SERVER_ROLE=all_in_one
      # 空串 = 关掉 Valkey（队列/缓存/会话退回 PG）。省一个容器，2G 机器上值。
      - VALKEY_URL=
      # 角色和库都是 glitchtip（步骤 8 在 PG 里建）。口令只存在同目录 .env，不入库。
      # 口令里若含 @ : / 等字符必须 URL 编码 —— 建议只用纯字母数字。
      - DATABASE_URL=postgresql://glitchtip:${GLITCHTIP_DB_PASSWORD:?缺 GLITCHTIP_DB_PASSWORD：填进 /opt/glitchtip/.env}@postgres:5432/glitchtip
      # 官方文档：必须带 scheme（Include scheme (http or https)）
      - GLITCHTIP_DOMAIN=https://errors.bookecho-shiyu.cn
      # settings.py:26 默认 ["*"]（:116 会为此打一条告警）。反代已锁定 Host 到本域，
      # 但容器端口在 prod 网络上仍可达，显式钉住只收这一个 Host。
      - ALLOWED_HOSTS=errors.bookecho-shiyu.cn
      # 首个用户建完即关掉自助注册
      - ENABLE_USER_REGISTRATION=False
      - SECRET_KEY=${SECRET_KEY:?缺 SECRET_KEY：填进 /opt/glitchtip/.env}
      - EMAIL_URL=${EMAIL_URL:?缺 EMAIL_URL：填进 /opt/glitchtip/.env}
      # settings.py:838 的默认值是 webmaster@localhost，Resend 要求发件域名已验证，
      # 必须改成主站同一个发件地址。名字仍用 RESEND_FROM_EMAIL（与主站 .env 一致）。
      - DEFAULT_FROM_EMAIL=${RESEND_FROM_EMAIL:?缺 RESEND_FROM_EMAIL：填进 /opt/glitchtip/.env}
    mem_limit: 384m
    mem_reservation: 192m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped
    networks:
      - prod

# 主站 compose 建的桥接网络（compose 项目名 character-distill 派生出这个名字）。
# 必须 external + 显式 name 钉住真实网络名：否则本文件自己的项目名会派生出
# glitchtip_prod，两个容器各在一个网络里，glitchtip 解析不到主机名 postgres。
networks:
  prod:
    external: true
    name: character-distill_prod
