# GlitchTip（errors.bookecho-shiyu.cn）反向代理
# 落点：/opt/character-distill/nginx/conf.d/glitchtip.conf
# 主 nginx.conf 的 http 块末尾有 `include /etc/nginx/conf.d/*.conf;`，本文件因此
# 落在同一个 http 上下文里 —— http 级的 access_log /var/log/openresty/access.log
# 自动继承，不要在这里另开日志文件：fail2ban 两个 jail 读的就是那个文件。

server {
    listen 80;
    server_name errors.bookecho-shiyu.cn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name errors.bookecho-shiyu.cn;

    # 与主站共用同一张证书（步骤 7 把 errors. 加进它的 SAN），
    # 路径来自主 compose 挂的 ssl_certs 卷。
    ssl_certificate     /etc/ssl/certs/fullchain.pem;
    ssl_certificate_key /etc/ssl/private/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;

    # 主站下发的是 includeSubDomains，子域也必须跟上，否则这里会成为唯一缺口
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # 官方示例为 40M（事件可带附件）。主站 http 级是 20m，这里按官方值显式放大。
    client_max_body_size 40m;

    # 用变量 + resolver：容器名 glitchtip 在 `openresty -t` 时不必存在。
    # 字面 proxy_pass 会在配置解析期解析主机名，-t 时 glitchtip 还没起就会失败。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $glitchtip http://glitchtip:8000;

    location / {
        proxy_pass $glitchtip;
        # 官方 nginx 示例的四个头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
