# ============================================================
# Deploy — 仅 workflow_dispatch：解析 digest → 灰度部署 SZ/SG
#
# 绝不包含 build 逻辑。镜像由 build.yml（push 触发）构建。
# digest 从最近的 build.yml 成功运行的 artifact 获取，
# 确保两节点拉到完全相同的 sha256 镜像。
#
# 回滚：填 image_sha（已有 tag），绕过 digest 直接按 tag 拉取。
# 显式 pin：填 build_run_id，锁定到某次 CI 构建的 digest。
#
# 所需 GitHub Secrets:
#   GHCR_TOKEN    — GitHub PAT (read:packages + write:packages)
#   SZ_DEPLOY_KEY — 深圳服务器 SSH 私钥
#   SG_DEPLOY_KEY — 新加坡服务器 SSH 私钥
# ============================================================

name: Deploy

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target'
        required: true
        default: 'both'
        type: choice
        options:
          - sz-only
          - sg-only
          - both
      image_sha:
        description: 'Rollback SHA tag (leave empty = deploy latest build)'
        required: false
        default: ''
        type: string
      build_run_id:
        description: 'Build workflow run ID (leave empty = latest successful build)'
        required: false
        default: ''
        type: string

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/verse-shiyu/character-distill-app
  NGINX_IMAGE: ghcr.io/verse-shiyu/character-distill-nginx
  ALIYUN_REGISTRY: crpi-4frg6xezdr40bmtr.cn-shenzhen.personal.cr.aliyuncs.com
  ALIYUN_APP_IMAGE: crpi-4frg6xezdr40bmtr.cn-shenzhen.personal.cr.aliyuncs.com/verse-shiyu/character-distill-app
  ALIYUN_NGINX_IMAGE: crpi-4frg6xezdr40bmtr.cn-shenzhen.personal.cr.aliyuncs.com/verse-shiyu/character-distill-nginx

jobs:
  # ── 解析目标镜像：digest / rollback tag / pinned run ────────
  resolve-digest:
    runs-on: ubuntu-latest
    outputs:
      app_digest: ${{ steps.parse.outputs.app_digest }}
      nginx_digest: ${{ steps.parse.outputs.nginx_digest }}
      commit_sha: ${{ steps.parse.outputs.commit_sha }}
      build_run_id: ${{ steps.parse.outputs.build_run_id }}
      build_time: ${{ steps.parse.outputs.build_time }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      actions: read
    steps:
      - name: Resolve source build run
        id: resolve
        run: |
          if [ -n "${{ github.event.inputs.image_sha }}" ]; then
            echo "mode=rollback" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ github.event.inputs.image_sha }}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.inputs.build_run_id }}" ]; then
            echo "mode=pinned" >> $GITHUB_OUTPUT
            echo "run_id=${{ github.event.inputs.build_run_id }}" >> $GITHUB_OUTPUT
          else
            echo "mode=latest" >> $GITHUB_OUTPUT
            RUN_ID=$(gh run list --workflow build.yml --branch main --status success --repo ${{ github.repository }} --limit 1 --json databaseId --jq '.[0].databaseId')
            if [ -z "${RUN_ID}" ]; then
              echo "::error::No successful build.yml run found on main branch"
              exit 1
            fi
            echo "run_id=${RUN_ID}" >> $GITHUB_OUTPUT
          fi

      - name: Download digest artifact
        if: steps.resolve.outputs.mode != 'rollback'
        uses: actions/download-artifact@v7
        with:
          name: digest-info
          run-id: ${{ steps.resolve.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Parse digests
        id: parse
        run: |
          if [ "${{ steps.resolve.outputs.mode }}" = "rollback" ]; then
            echo "app_digest=" >> $GITHUB_OUTPUT
            echo "nginx_digest=" >> $GITHUB_OUTPUT
            echo "commit_sha=${{ steps.resolve.outputs.commit_sha }}" >> $GITHUB_OUTPUT
            echo "build_run_id=" >> $GITHUB_OUTPUT
            echo "build_time=" >> $GITHUB_OUTPUT
          elif [ -f digest-info.json ]; then
            echo "app_digest=$(jq -r '.app_digest // empty' digest-info.json)" >> $GITHUB_OUTPUT
            echo "nginx_digest=$(jq -r '.nginx_digest // empty' digest-info.json)" >> $GITHUB_OUTPUT
            echo "commit_sha=$(jq -r '.commit_sha // empty' digest-info.json)" >> $GITHUB_OUTPUT
            echo "build_run_id=$(jq -r '.build_run_id // empty' digest-info.json)" >> $GITHUB_OUTPUT
            echo "build_time=$(jq -r '.build_time // empty' digest-info.json)" >> $GITHUB_OUTPUT
          else
            echo "::error::digest-info.json not found after artifact download"
            exit 1
          fi

      - name: Job summary
        run: |
          MODE="${{ steps.resolve.outputs.mode }}"
          TARGET="${{ github.event.inputs.target }}"
          COMMIT="${{ steps.parse.outputs.commit_sha }}"
          APP_DIGEST_VAL="${{ steps.parse.outputs.app_digest || '-' }}"
          NGINX_DIGEST_VAL="${{ steps.parse.outputs.nginx_digest || '-' }}"
          BUILD_RUN="${{ steps.parse.outputs.build_run_id || '-' }}"
          BUILD_TIME="${{ steps.parse.outputs.build_time || '-' }}"
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Deploy target

          | Field | Value |
          |-------|-------|
          | **Mode** | ${MODE} |
          | **Target nodes** | ${TARGET} |
          | **Commit** | \`${COMMIT}\` |
          | **App image digest** | \`${APP_DIGEST_VAL}\` |
          | **Nginx image digest** | \`${NGINX_DIGEST_VAL}\` |
          | **Build run ID** | ${BUILD_RUN} |
          | **Build time** | ${BUILD_TIME} |
          EOF

  # ── 灰度部署深圳 ───────────────────────────────────────────
  deploy-sz:
    needs: resolve-digest
    if: always() && needs.resolve-digest.result == 'success' && (github.event.inputs.target == 'sz-only' || github.event.inputs.target == 'both')
    runs-on: ubuntu-latest
    env:
      APP_DIGEST: ${{ needs.resolve-digest.outputs.app_digest }}
      NGINX_DIGEST: ${{ needs.resolve-digest.outputs.nginx_digest }}
      COMMIT_SHA: ${{ needs.resolve-digest.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Push docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 47.107.42.111
          username: root
          key: ${{ secrets.SZ_DEPLOY_KEY }}
          source: docker-compose.prod.yml
          target: /opt/character-distill/
          overwrite: true

      - name: Deploy to Shenzhen
        uses: appleboy/ssh-action@v1
        with:
          host: 47.107.42.111
          username: root
          key: ${{ secrets.SZ_DEPLOY_KEY }}
          command_timeout: 30m
          envs: APP_DIGEST,NGINX_DIGEST,COMMIT_SHA
          script: |
            set -e
            cd /opt/character-distill

            # Login to both registries
            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u verse-shiyu --password-stdin
            echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.ALIYUN_REGISTRY }} -u "${{ secrets.ACR_USERNAME }}" --password-stdin

            # Record current version for rollback
            PREV_SHA=$(docker inspect --format='{{index .Config.Image}}' character-distill-app-1 2>/dev/null | grep -oE '[a-f0-9]{40}' || echo "")
            echo "Previous version: ${PREV_SHA:-first deploy}"
            echo "Target commit: ${COMMIT_SHA}"

            if [ -z "${COMMIT_SHA}" ]; then
              echo "FATAL: COMMIT_SHA is empty, cannot deploy"
              exit 1
            fi

            ALIYUN_REPO_PREFIX="${{ env.ALIYUN_REGISTRY }}/verse-shiyu"
            GHCR_REPO_PREFIX="ghcr.io/verse-shiyu"

            # 拉一个镜像，把**实际命中的仓库**写进全局 PULLED_REGISTRY。
            # 阿里云优先（同区，快；对 SZ 是必需），拉不到再试 GHCR。
            # 调用方只拿 PULLED_REGISTRY 去导出 compose 的 *_IMAGE_REGISTRY ——
            # 「部署用哪个镜像」只取自实际拉取成功的那一个，不预设、不写死。
            # 两个仓库都失败则 return 1，调用方立刻失败，绝不继续 compose up
            #（写死一个没拉到的仓库，compose 会自己再去拉一次，失败信息埋在 compose 里）。
            #
            # 只此一处：app / nginx / postgres / fail2ban 四处共用同一条判断。
            # 各写一份的话，迟早在某一次改动后分叉 —— 而分叉出来的那半正是本次的病灶：
            # 拉取阶段认了 GHCR、导出阶段仍写阿里云，两边各说各话。
            #
            # $1=阿里云引用(repo:tag) $2=回落仓库$3=回落 digest(可空) $4=回落 tag
            # digest 落地的镜像本地没有 tag，而 compose 的 image: 只能是 repo:tag，
            # 故补一个 $4 的 tag（SG 那条路一直是这么做的）。
            pull_image() {
              PULLED_REGISTRY=""
              if docker pull "$1" 2>/dev/null; then
                PULLED_REGISTRY="${ALIYUN_REPO_PREFIX}"
              elif [ -n "$3" ] && docker pull "$2@$3"; then
                docker tag "$2@$3" "$2:$4"
                PULLED_REGISTRY="${2%/*}"
              elif docker pull "$2:$4"; then
                PULLED_REGISTRY="${2%/*}"
              else
                return 1
              fi
            }

            pull_image "${ALIYUN_REPO_PREFIX}/character-distill-app:${COMMIT_SHA}" \
                       "${GHCR_REPO_PREFIX}/character-distill-app" "${APP_DIGEST}" "${COMMIT_SHA}" \
              || { echo "FATAL: app 镜像在阿里云与 GHCR 均拉取失败，中止部署（不执行 compose up）"; exit 1; }
            export APP_IMAGE_REGISTRY="${PULLED_REGISTRY}"

            pull_image "${ALIYUN_REPO_PREFIX}/character-distill-nginx:${COMMIT_SHA}" \
                       "${GHCR_REPO_PREFIX}/character-distill-nginx" "${NGINX_DIGEST}" "${COMMIT_SHA}" \
              || { echo "FATAL: nginx 镜像在阿里云与 GHCR 均拉取失败，中止部署（不执行 compose up）"; exit 1; }
            export NGINX_IMAGE_REGISTRY="${PULLED_REGISTRY}"

            # postgres / fail2ban 同样走这条判断。这两者原先被无条件写死成阿里云：Docker Hub
            # 从 SZ 拉超时（2026-07-01 的 `8213668` 就是为这个才改的），所以阿里云必须留在
            # 首选位；但「写死」正是本次要拆掉的东西 —— 拉不到就该退到 Docker Hub，两边都
            # 拉不到就报错，而不是把 compose 指向一个本地不存在的引用。
            pull_image "${ALIYUN_REPO_PREFIX}/postgres:16-alpine" \
                       "docker.io/library/postgres" "" "16-alpine" \
              || { echo "FATAL: postgres 镜像在阿里云与 Docker Hub 均拉取失败，中止部署"; exit 1; }
            export PG_IMAGE_REGISTRY="${PULLED_REGISTRY}"

            pull_image "${ALIYUN_REPO_PREFIX}/fail2ban:1.1.0" \
                       "docker.io/crazymax/fail2ban" "" "1.1.0" \
              || { echo "FATAL: fail2ban 镜像在阿里云与 Docker Hub 均拉取失败，中止部署"; exit 1; }
            export FAIL2BAN_IMAGE_REGISTRY="${PULLED_REGISTRY}"

            export APP_IMAGE_TAG=${COMMIT_SHA}
            export NGINX_IMAGE_TAG=${COMMIT_SHA}
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # ── 健康门分两段：先存活、再就绪 ──
            # 合成一段时，「app 没起来」与「app 起来了但库连不上」共用一个红信号 ——
            # 而两者的处置不同：前者回滚大概率有用，后者往往是配置层故障，回滚不一定治得了。
            SZ_gate() {
              # $1=阶段名 $2=探针路径 $3=失败说明。12×5s，与老门一致。
              # --max-time 5 与 Docker HEALTHCHECK 的 timeout 对齐：库不可达时就绪请求会一路
              # 挂到驱动的连接超时，不设上限的话单次探针能烧掉十几秒，12 次重试远超一分钟。
              SZ_stage="$1"; SZ_path="$2"; SZ_why="$3"; SZ_ok=0
              echo "Waiting for ${SZ_stage} check..."
              for i in $(seq 1 12); do
                sleep 5
                if curl -sf --max-time 5 "http://localhost:7860${SZ_path}" > /dev/null 2>&1; then
                  echo "SZ ${SZ_stage} check passed (attempt ${i})"
                  SZ_ok=1
                  break
                fi
                echo "  ${SZ_stage} attempt ${i}/12 failed..."
              done
              if [ "$SZ_ok" -ne 1 ]; then
                echo "SZ ${SZ_stage} check FAILED: ${SZ_why}"
                return 1
              fi
              return 0
            }

            SZ_rollback() {
              if [ -n "$PREV_SHA" ]; then
                # 回滚同样走 pull_image：回滚用的镜像也得与导出的仓库同源。旧写法拉取时认
                # 阿里云-or-GHCR，却把 APP_IMAGE_REGISTRY 固定成阿里云 —— 从 GHCR 拉回来的
                # 那一版，compose 根本找不到。
                pull_image "${ALIYUN_REPO_PREFIX}/character-distill-app:${PREV_SHA}" \
                           "${GHCR_REPO_PREFIX}/character-distill-app" "" "${PREV_SHA}" \
                  || { echo "回滚失败：app ${PREV_SHA} 在两个仓库都拉不到，保持现状"; return 1; }
                export APP_IMAGE_REGISTRY="${PULLED_REGISTRY}"
                pull_image "${ALIYUN_REPO_PREFIX}/character-distill-nginx:${PREV_SHA}" \
                           "${GHCR_REPO_PREFIX}/character-distill-nginx" "" "${PREV_SHA}" \
                  || { echo "回滚失败：nginx ${PREV_SHA} 在两个仓库都拉不到，保持现状"; return 1; }
                export NGINX_IMAGE_REGISTRY="${PULLED_REGISTRY}"
                export APP_IMAGE_TAG=${PREV_SHA}
                export NGINX_IMAGE_TAG=${PREV_SHA}
                docker compose -f docker-compose.prod.yml up -d
                echo "Rolled back to ${PREV_SHA}"
              fi
            }

            # 第一段：存活。/api/health 不碰库，只说明进程起来了。
            if ! SZ_gate "liveness" "/api/health" "app 未起来（/api/health 不通），回滚"; then
              SZ_rollback
              exit 1
            fi

            # 第二段：就绪。真查一次库 —— 凭据错、库连不上在这里才第一次可见。
            if ! SZ_gate "readiness" "/api/health/ready" \
                 "app 已起来但数据库不可用（凭据或网络）；回滚不一定能修复配置层故障"; then
              SZ_rollback
              exit 1
            fi

            # ── 镜像/缓存自动清理（保留当前版+上一版用于 rollback）──
            # 1. 清构建缓存（保留 2GB 热缓存加速下次 build）
            docker builder prune -f --keep-storage 2GB || true
            # 2. 清旧镜像：只保留当前版 COMMIT_SHA + 上一版 PREV_SHA + latest
            if [ -n "$PREV_SHA" ]; then
              for repo in character-distill-app character-distill-nginx; do
                # GHCR cleanup
                docker images "ghcr.io/verse-shiyu/${repo}" --format '{{.Tag}}' \
                  | grep -vE "^(${COMMIT_SHA}|${PREV_SHA}|latest|<none>)$" \
                  | while read tag; do
                      docker rmi "ghcr.io/verse-shiyu/${repo}:${tag}" 2>/dev/null || true
                    done
                # Aliyun CR cleanup
                docker images "${{ env.ALIYUN_REGISTRY }}/verse-shiyu/${repo}" --format '{{.Tag}}' \
                  | grep -vE "^(${COMMIT_SHA}|${PREV_SHA}|latest|<none>)$" \
                  | while read tag; do
                      docker rmi "${{ env.ALIYUN_REGISTRY }}/verse-shiyu/${repo}:${tag}" 2>/dev/null || true
                    done
              done
            else
              echo "PREV_SHA empty (first deploy?), skip old-image cleanup"
            fi
            # 3. 清 dangling 镜像
            docker image prune -f || true
            echo "SZ deployment successful"

  # ── 部署新加坡 ────────────────────────────────────────────
  deploy-sg:
    needs: [resolve-digest, deploy-sz]
    if: |
      always() && needs.resolve-digest.result == 'success' && (
      github.event.inputs.target == 'sg-only' ||
      (github.event.inputs.target == 'both' && needs.deploy-sz.result == 'success')
      )
    runs-on: ubuntu-latest
    env:
      APP_DIGEST: ${{ needs.resolve-digest.outputs.app_digest }}
      NGINX_DIGEST: ${{ needs.resolve-digest.outputs.nginx_digest }}
      COMMIT_SHA: ${{ needs.resolve-digest.outputs.commit_sha }}
    steps:
      - uses: actions/checkout@v5

      - name: Push docker-compose.prod.yml to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: 43.134.55.201
          username: ubuntu
          key: ${{ secrets.SG_DEPLOY_KEY }}
          source: docker-compose.prod.yml
          target: /home/ubuntu/Character-distill/
          overwrite: true

      - name: Deploy to Singapore
        uses: appleboy/ssh-action@v1
        with:
          host: 43.134.55.201
          username: ubuntu
          key: ${{ secrets.SG_DEPLOY_KEY }}
          envs: APP_DIGEST,NGINX_DIGEST,COMMIT_SHA
          script: |
            set -e
            cd /home/ubuntu/Character-distill

            echo "${{ secrets.GHCR_TOKEN }}" | docker login ghcr.io -u verse-shiyu --password-stdin

            PREV_SHA=$(docker inspect --format='{{index .Config.Image}}' character-distill-app-1 2>/dev/null | grep -oE '[a-f0-9]{40}' || echo "")
            echo "Previous version: ${PREV_SHA:-first deploy}"
            echo "Target commit: ${COMMIT_SHA}"

            if [ -z "${COMMIT_SHA}" ]; then
              echo "FATAL: COMMIT_SHA is empty, cannot deploy"
              exit 1
            fi

            if [ -n "${APP_DIGEST}" ]; then
              docker pull ghcr.io/verse-shiyu/character-distill-app@${APP_DIGEST}
              docker tag ghcr.io/verse-shiyu/character-distill-app@${APP_DIGEST} ghcr.io/verse-shiyu/character-distill-app:${COMMIT_SHA}
            else
              docker pull ghcr.io/verse-shiyu/character-distill-app:${COMMIT_SHA}
            fi

            if [ -n "${NGINX_DIGEST}" ]; then
              docker pull ghcr.io/verse-shiyu/character-distill-nginx@${NGINX_DIGEST}
              docker tag ghcr.io/verse-shiyu/character-distill-nginx@${NGINX_DIGEST} ghcr.io/verse-shiyu/character-distill-nginx:${COMMIT_SHA}
            else
              docker pull ghcr.io/verse-shiyu/character-distill-nginx:${COMMIT_SHA}
            fi

            export APP_IMAGE_TAG=${COMMIT_SHA}
            export NGINX_IMAGE_TAG=${COMMIT_SHA}
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

            # ── 健康门分两段：先存活、再就绪 ──
            # 与 SZ 同形，差异只有区域名（与回滚用的源：本区走 GHCR）。
            SG_gate() {
              # $1=阶段名 $2=探针路径 $3=失败说明。12×5s，与老门一致。
              # --max-time 5 与 Docker HEALTHCHECK 的 timeout 对齐：库不可达时就绪请求会一路
              # 挂到驱动的连接超时，不设上限的话单次探针能烧掉十几秒，12 次重试远超一分钟。
              SG_stage="$1"; SG_path="$2"; SG_why="$3"; SG_ok=0
              echo "Waiting for ${SG_stage} check..."
              for i in $(seq 1 12); do
                sleep 5
                if curl -sf --max-time 5 "http://localhost:7860${SG_path}" > /dev/null 2>&1; then
                  echo "SG ${SG_stage} check passed (attempt ${i})"
                  SG_ok=1
                  break
                fi
                echo "  ${SG_stage} attempt ${i}/12 failed..."
              done
              if [ "$SG_ok" -ne 1 ]; then
                echo "SG ${SG_stage} check FAILED: ${SG_why}"
                return 1
              fi
              return 0
            }

            SG_rollback() {
              if [ -n "$PREV_SHA" ]; then
                docker pull ghcr.io/verse-shiyu/character-distill-app:${PREV_SHA}
                docker pull ghcr.io/verse-shiyu/character-distill-nginx:${PREV_SHA}
                export APP_IMAGE_TAG=${PREV_SHA}
                export NGINX_IMAGE_TAG=${PREV_SHA}
                docker compose -f docker-compose.prod.yml up -d
                echo "Rolled back to ${PREV_SHA}"
              fi
            }

            # 第一段：存活。/api/health 不碰库，只说明进程起来了。
            if ! SG_gate "liveness" "/api/health" "app 未起来（/api/health 不通），回滚"; then
              SG_rollback
              exit 1
            fi

            # 第二段：就绪。真查一次库 —— 凭据错、库连不上在这里才第一次可见。
            if ! SG_gate "readiness" "/api/health/ready" \
                 "app 已起来但数据库不可用（凭据或网络）；回滚不一定能修复配置层故障"; then
              SG_rollback
              exit 1
            fi

            # ── 镜像/缓存自动清理（保留当前版+上一版用于 rollback）──
            # 1. 清构建缓存（保留 2GB 热缓存加速下次 build）
            docker builder prune -f --keep-storage 2GB || true
            # 2. 清旧镜像：只保留当前版 COMMIT_SHA + 上一版 PREV_SHA + latest
            if [ -n "$PREV_SHA" ]; then
              for repo in character-distill-app character-distill-nginx; do
                docker images "ghcr.io/verse-shiyu/${repo}" --format '{{.Tag}}' \
                  | grep -vE "^(${COMMIT_SHA}|${PREV_SHA}|latest|<none>)$" \
                  | while read tag; do
                      docker rmi "ghcr.io/verse-shiyu/${repo}:${tag}" 2>/dev/null || true
                    done
              done
            else
              echo "PREV_SHA empty (first deploy?), skip old-image cleanup"
            fi
            # 3. 清 dangling 镜像
            docker image prune -f || true
            echo "SG deployment successful"
