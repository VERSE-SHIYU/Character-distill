# ============================================================
# Build — push 触发：test → build → push GHCR → 存 digest
#
# 绝不包含部署逻辑。部署见 deploy.yml（workflow_dispatch 专用）。
# ============================================================

name: Build

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  APP_IMAGE: ghcr.io/verse-shiyu/character-distill-app
  NGINX_IMAGE: ghcr.io/verse-shiyu/character-distill-nginx
  ALIYUN_REGISTRY: crpi-4frg6xezdr40bmtr.cn-shenzhen.personal.cr.aliyuncs.com
  ALIYUN_APP_IMAGE: crpi-4frg6xezdr40bmtr.cn-shenzhen.personal.cr.aliyuncs.com/verse-shiyu/character-distill-app
  ALIYUN_NGINX_IMAGE: crpi-4frg6xezdr40bmtr.cn-shenzhen.personal.cr.aliyuncs.com/verse-shiyu/character-distill-nginx

jobs:
  # ══════════════════════════════════════════════════════════════════════════
  # 本 workflow 的 test 侧有**两条独立的门**，它们回答的是两个不同的问题。
  # 分开的理由（缺陷 40）：一条红**必须自证是「我变了」还是「世界变了」**。
  # 从前只有一条，上游发一次版就会让它红，红的样子和「本仓代码写错了」一模一样 ——
  # 两种成因共用一个信号，等于两种都没有守卫。现在：
  #
  #   test（gate）        依赖按 requirements*.txt 锁死 → 命题「本仓有没有回归」。
  #                       上游发版**动不了它**。它红 = 你写错了。
  #   upstream-drift      依赖从 requirements*.in 装最新 → 命题「上游有没有动」。
  #                       continue-on-error，不挡合并，不在 test 的 needs 链上。
  #                       它红 = 世界变了，本仓大概率无辜。
  #
  # 一眼分辨（不需要比对版本号）：**跑红 = gate；跑绿但有个 job 打红叉 = 哨兵。**
  # 两条 job 失败时各自往日志末尾打一条带 title 的 ::error/::warning 注解，把
  # 「这条红意味着什么」写在失败输出自己身上，而不是写在注释里。
  # 两边都上传 pip freeze 产物 —— 下次红时「CI 当时装的是哪一版」是可查的事实。
  # ══════════════════════════════════════════════════════════════════════════
  test:
    name: "gate / 本仓回归（依赖按锁）— 红 = 你写错了"
    runs-on: ubuntu-latest
    services:
      postgres: &pg_service
        image: postgres:16-alpine
        env:
          POSTGRES_USER: charsim
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: charsim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      # fetch-depth: 0 是**承重的**，不是顺手加的：tests/test_evidence_integrity.py 的
      # test_code_sha_resolves 用 `git cat-file -t <sha>` 核 manifest 里的 code_sha，
      # 默认的 fetch-depth: 1 是浅克隆（只有最新一个 commit），历史里的 sha 一律解析不出，
      # 该用例会对每条 code_sha 报「不是 commit」——数据其实是对的。
      # **不要为加速 CI 改回浅克隆**（等于在 CI 里关掉这条锁，而 CI 最该守它）。
      # 跑 pytest 的两个 job（本 job 与 upstream-drift）都要加；build job 不跑它，故那里不加。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 装 **锁**（requirements*.txt，全是 ==），不是装 .in 那些下界。
      # 这一行就是「上游发版动不了这条 job」的全部机制 —— 换成 .in，两条门立刻
      # 退化成同一条（缺陷 40 复发）。
      - name: Install dependencies (from the lock)
        run: |
          pip install --no-cache-dir -r requirements.txt
          pip install --no-cache-dir -r requirements-dev.txt

      - name: pip freeze → artifact（这条门当时装的是哪一版）
        run: python -m pip freeze --all > pip-freeze-gate.txt

      # compose 的**锁** —— 与上面 requirements*.txt 完全同一个理由：事实层（tests/compose_model.py）
      # 的两条承重前提 P-a/P-b 在 compose v2.x 上**不成立**（v2.x 两个 flag 都在，但行为不成立），
      # 而 ubuntu-latest 自带的恰恰是 v2。
      #
      # **订正（审计 F4）**：这里原先写「不钉住就会在事实层静默失效的状态下判绿」，与事实相反。
      # 事实是那条 job **红了** —— 运行 `35075782258`（HEAD `0cb193f`）实测 `11 failed`，而每条红
      # 报的是**症状**不是**成因**：stderr 是 `env file .../Character-distill/.env not found`。
      # 看日志的人会去查「干净检出上为什么没有 .env」，而不是去查「本机 compose 够不够格」。
      # 红得指错地方比静默判绿轻，但同样是没守卫：两种成因（本机环境不对 / 本仓写错）共用
      # 了同一个信号。实测 v5.0.0 起两条行为都满足，这里钉 v5.5.1。
      #
      # 用户级 cli-plugin（$HOME/.docker/cli-plugins）在 Docker CLI 的搜索序里**先于** runner
      # 自带的系统插件（/usr/libexec/docker/cli-plugins），所以装到用户级就能盖住它。
      # 最后那句断言是**承重的**，不是装饰：不核它，「钉在 v5.5.1」就只是注释里的一个数字，
      # 装歪了（比如覆盖没生效、仍是 v2）照样一片绿。
      - name: Pin docker compose v5.5.1（事实层承重前提的最低版本）
        run: |
          set -euo pipefail
          VERSION=v5.5.1
          EXPECTED_SHA256=db1889184726840f75c4f9c001048430d4f25b3be3cb084d3ddd762bc0aed576
          curl -fsSL -o /tmp/docker-compose \
            "https://github.com/docker/compose/releases/download/${VERSION}/docker-compose-linux-x86_64"
          echo "${EXPECTED_SHA256}  /tmp/docker-compose" | sha256sum -c -
          mkdir -p "$HOME/.docker/cli-plugins"
          install -m 0755 /tmp/docker-compose "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version
          docker compose version | grep -qE '\bv5\.5\.1\b' || {
            echo "::error title=compose 版本没钉住::期望 v5.5.1，实得「$(docker compose version 2>&1 | head -1)」"; exit 1; }

      - name: Run tests
        env:
          STORAGE_BACKEND: postgres
          DATABASE_URL: postgresql://charsim:ci_test_password@localhost:5432/charsim
          JWT_SECRET: ci-test-only-jwt-secret-not-for-production-use-0123456789abcdef
          # 声明「本环境保证有 PG」：依赖 PG 的用例据此**拒绝 skip**（连不上就直接红），
          # 而不是静默跳过。本地不设它 → 没 PG 时显式 skip 并给出原因。
          # 这是 tests/conftest.py::pg_required() 唯一认的那个声明，别删。
          REQUIRE_PG_TESTS: "1"
          # 同理声明「本环境保证有 docker compose」。门的锁判的是 compose 的**有效模型**
          # （tests/compose_model.py 真跑一次 `docker compose config`）—— 没有 CLI 时那批
          # 用例是**显式 skip** 而不是红，本地那样可以，CI 不行：CI 最该真跑门锁。
          #
          # **这条声明的前置是上面那步「Pin docker compose v5.5.1」。** 原先这里写的是
          # 「ubuntu-latest 自带 compose v2（实测 2.38.2，两个 flag 都在）」—— 那次「实测」
          # 测的是 **flag 存不存在**，不是事实层要的两条**行为**：v2.x 上 flag 都在，而
          # P-a（`env_file` 缺文件仍 exit 0）与 P-b（`env_file` 的值不进模型输出）**都不成立**。
          # 订正（审计 F4）：由此原先说「CI 一直在事实层静默失效的状态下判绿」是错的 ——
          # 那轮 CI **红了**（运行 `35075782258` 实测 `11 failed`），红得指错地方：报的是症状
          # `.env not found`，不是成因。判据是行为，故上面钉版本 + 断言版本号，这里才敢声明。
          REQUIRE_COMPOSE_TESTS: "1"
        run: pytest tests/ -v --tb=short

      - name: 红的时候说清楚这条红意味着什么
        if: failure()
        run: |
          echo "::error title=本仓回归（gate 红了）::依赖是按 requirements*.txt 锁装的，上游发版动不了这条 job。所以这条红 = 本仓代码或本仓的锁出了问题。要判断是不是上游动的，看 upstream-drift 那条。"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-freeze-gate
          retention-days: 30
          if-no-files-found: error
          path: pip-freeze-gate.txt

  # 哨兵：装最新，允许红，不挡合并。它红了表示上游发了版、行为变了 ——
  # 这时要做的决定是「升锁跟上去」还是「在上限里钉住它」，不是去读本仓的 diff。
  upstream-drift:
    name: "sentinel / 上游漂移（依赖不锁）— 红 = 世界变了，不挡合并"
    runs-on: ubuntu-latest
    continue-on-error: true
    services:
      postgres: *pg_service
    steps:
      # fetch-depth: 0 —— 与 gate 同一条理由（`test_code_sha_resolves` 要 `git cat-file`
      # 解析 manifest 里的历史 sha）。**这里漏掉它不会让哨兵变绿、而是让它无差别地红**：
      # 浅克隆下那条锁报的「不是 commit」与上游漂移长得一样，哨兵立刻退化成噪声源 ——
      # 正好复犯缺陷 40 要修的那个错（两种成因共用一个信号）。
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # 装 **下界** 而不是锁 —— 这一行就是「这条 job 只对上游敏感、对本仓不敏感」的机制。
      - name: Install dependencies (latest allowed by the floors)
        run: |
          pip install --no-cache-dir -r requirements.in
          pip install --no-cache-dir -r requirements-dev.in

      - name: pip freeze → artifact（漂移时到底是哪一版动的）
        run: python -m pip freeze --all > pip-freeze-sentinel.txt

      # compose 的**下界**（与上面 requirements*.in 同理）：装最新 release，不锁。
      # 它红了、而 gate 那条绿，就说明**是 compose 自己变了**（P-a/P-b 两条行为之一被改掉
      # 或最低版本线发生位移），不是本仓写错了。tag 取自 releases/latest 的跳转，
      # 完整性取自同一个 release 自带的 `.sha256` —— 不硬编码版本号，否则哨兵就成了另一把锁。
      - name: Latest docker compose（哨兵：compose 自己的上游漂移）
        run: |
          set -euo pipefail
          TAG=$(curl -fsSLI -o /dev/null -w '%{url_effective}' \
            https://github.com/docker/compose/releases/latest | sed -E 's#.*/tag/##')
          echo "docker compose latest tag: ${TAG}"
          BASE="https://github.com/docker/compose/releases/download/${TAG}"
          curl -fsSL -o /tmp/docker-compose "${BASE}/docker-compose-linux-x86_64"
          curl -fsSL -o /tmp/docker-compose.sha256 "${BASE}/docker-compose-linux-x86_64.sha256"
          # 资产自带的校验文件写的是发布名，比对前先改成本地文件名
          sed -E 's#\*?docker-compose-linux-x86_64$#docker-compose#' /tmp/docker-compose.sha256 \
            | ( cd /tmp && sha256sum -c - )
          mkdir -p "$HOME/.docker/cli-plugins"
          install -m 0755 /tmp/docker-compose "$HOME/.docker/cli-plugins/docker-compose"
          docker compose version

      - name: Run tests
        env:
          STORAGE_BACKEND: postgres
          DATABASE_URL: postgresql://charsim:ci_test_password@localhost:5432/charsim
          JWT_SECRET: ci-test-only-jwt-secret-not-for-production-use-0123456789abcdef
          REQUIRE_PG_TESTS: "1"
          # 与 gate 同一条理由：哨兵也要真跑门锁，不允许靠「没有 docker」静默跳过 ——
          # 那样哨兵会漏掉一整类上游漂移（compose 自身的行为变化），而它正是为此存在的。
          REQUIRE_COMPOSE_TESTS: "1"
        run: pytest tests/ -v --tb=short

      - name: 红的时候说清楚这条红意味着什么
        if: failure()
        run: |
          echo "::warning title=上游漂移（哨兵红了）::这条 job 装的是 requirements*.in（下界），它红 = 上游某个包发了新版、行为变了。本仓代码大概率没动。拿 pip-freeze-sentinel 和 pip-freeze-gate 两个产物相减，就是「谁动的」。处置：升锁跟上，或在 .in 里给它加上限。"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pip-freeze-sentinel
          retention-days: 30
          if-no-files-found: error
          path: pip-freeze-sentinel.txt

  build:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/frontend/package-lock.json

      - name: Frontend lint (no-undef gate)
        run: |
          npm ci
          npx eslint src -c eslint.ci.config.js --quiet
        working-directory: web/frontend

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Aliyun CR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.ALIYUN_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build and push app image
        id: build_app
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ env.APP_IMAGE }}:latest
            ${{ env.APP_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 光有 continue-on-error 只接了「失败」，接不住「挂住」：挂死不算失败，这一步会一直
      # 占着直到 build job 撞 360 分钟上限，把整条 build 一起拖住（2026-09-21 实发：卡在
      # `docker push` 上 2h40m）。step 级 timeout-minutes 到点即失败，由本步的
      # continue-on-error 接住 —— 挂死从此也落进「可选步骤失败」那一类。
      # 取值 = 最近 20 次成功 build 中本步耗时的 max×3 向上取整，数据见引入本行的 commit message。
      - name: Push app image to Aliyun CR
        continue-on-error: true
        timeout-minutes: 89
        run: |
          docker pull ${{ env.APP_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.APP_IMAGE }}:${{ github.sha }} ${{ env.ALIYUN_APP_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.APP_IMAGE }}:${{ github.sha }} ${{ env.ALIYUN_APP_IMAGE }}:latest
          docker push ${{ env.ALIYUN_APP_IMAGE }}:${{ github.sha }}
          docker push ${{ env.ALIYUN_APP_IMAGE }}:latest

      - name: Build and push nginx image
        id: build_nginx
        uses: docker/build-push-action@v7
        with:
          context: ./nginx
          push: true
          tags: |
            ${{ env.NGINX_IMAGE }}:latest
            ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 同上一步：取值 = 最近 20 次成功 build 中本步耗时的 max×3 向上取整，数据见引入本行的 commit message。
      - name: Push nginx image to Aliyun CR
        continue-on-error: true
        timeout-minutes: 3
        run: |
          docker pull ${{ env.NGINX_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.NGINX_IMAGE }}:${{ github.sha }} ${{ env.ALIYUN_NGINX_IMAGE }}:${{ github.sha }}
          docker tag ${{ env.NGINX_IMAGE }}:${{ github.sha }} ${{ env.ALIYUN_NGINX_IMAGE }}:latest
          docker push ${{ env.ALIYUN_NGINX_IMAGE }}:${{ github.sha }}
          docker push ${{ env.ALIYUN_NGINX_IMAGE }}:latest

      - name: Write digest file
        run: |
          BUILD_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq -n \
            --arg app "${{ steps.build_app.outputs.digest }}" \
            --arg nginx "${{ steps.build_nginx.outputs.digest }}" \
            --arg sha "${{ github.sha }}" \
            --arg run_id "${{ github.run_id }}" \
            --arg time "${BUILD_TIME}" \
            '{app_digest: $app, nginx_digest: $nginx, commit_sha: $sha, build_run_id: $run_id, build_time: $time}' \
            > digest-info.json

      - name: Upload digest artifact
        uses: actions/upload-artifact@v7
        with:
          name: digest-info
          retention-days: 30
          if-no-files-found: error
          path: digest-info.json

      - name: Job summary
        run: |
          cat >> $GITHUB_STEP_SUMMARY <<EOF
          ## Build result

          | Image | Digest |
          |-------|--------|
          | App | \`${{ steps.build_app.outputs.digest }}\` |
          | Nginx | \`${{ steps.build_nginx.outputs.digest }}\` |

          **Commit:** \`${{ github.sha }}\`
          **Run ID:** ${{ github.run_id }}
          EOF
