# 基础镜像（Dockerfile / nginx/Dockerfile 的 FROM 已锁 digest）的升级由此开 PR，人工合并。
# https://docs.github.com/en/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  - package-ecosystem: docker
    directories: ["/", "/nginx"]
    schedule:
      interval: weekly
    # 只提同一 tag 内的 digest / 补丁更新；跨大版本（如 node 20→26）由人决定何时做，不自动提 PR
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
